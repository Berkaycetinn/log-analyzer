# Overlay for disposable synthetic-only verification; never use a real database.
services:
  postgres:
    environment:
      POSTGRES_DB: log_analyzer_e2e_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U log_analyzer -d log_analyzer_e2e_test"]
  backend:
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/log_analyzer_e2e_test
