name: Complete Docker pipeline verification
on:
  push:
    paths: ["frontend/**", "backend/**", "ai_service/**", "api.py", "requirements.txt", "Dockerfile.ai", "compose*.yml", "scripts/verify_persistence.py", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", "ai_service/**", "api.py", "requirements.txt", "Dockerfile.ai", "compose*.yml", "scripts/verify_persistence.py", ".github/workflows/e2e.yml"]
  workflow_dispatch:
jobs:
  production-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: pipeline-verification
      COMPOSE_FILE: compose.yml:compose.e2e.yml
      FRONTEND_URL: http://127.0.0.1:5173
      E2E_KEEP_JOB: "1"
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_publish_paths.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare disposable verification environment
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "E2E_RECEIPT=$RUNNER_TEMP/e2e-receipt.json" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build and start actual production containers
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 300
          curl --fail --retry 60 --retry-all-errors --retry-max-time 120 --connect-timeout 3 --max-time 5 --retry-delay 2 http://127.0.0.1:8080/actuator/health
      - name: Real browser upload and inference, including saved JSON download
        working-directory: frontend
        run: npm run test:e2e
      - name: Verify SQL persistence before and after backend restart
        run: |
          export PGPASSWORD="$POSTGRES_PASSWORD"
          python3 scripts/verify_persistence.py --receipt "$E2E_RECEIPT" --database log_analyzer_e2e_test --pg-user log_analyzer --pg-port 55432
          docker compose restart backend
          curl --fail --retry 60 --retry-all-errors --retry-max-time 120 --connect-timeout 3 --max-time 5 --retry-delay 2 http://127.0.0.1:8080/actuator/health
          python3 scripts/verify_persistence.py --receipt "$E2E_RECEIPT" --database log_analyzer_e2e_test --pg-user log_analyzer --pg-port 55432
          node frontend/scripts/verify-restart.mjs
          job_id=$(python3 -c 'import json,os; print(json.load(open(os.environ["E2E_RECEIPT"]))["job_id"])')
          curl --fail -X DELETE "http://127.0.0.1:8080/api/v1/analyses/$job_id"
          test "$(psql -X -w -h 127.0.0.1 -p 55432 -U log_analyzer -d log_analyzer_e2e_test -t -A -c 'SELECT count(*) FROM analysis_jobs')" = "0"
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

