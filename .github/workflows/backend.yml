name: Backend verification
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml", "scripts/check_publish_paths.py", ".gitignore"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", "scripts/check_publish_paths.py", ".gitignore"]
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: backend_test
          POSTGRES_USER: backend_test
          # Disposable CI database containing synthetic fixtures only.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backend_test -d backend_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_publish_paths.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml -Ppostgres-it verify
        env:
          BACKEND_TEST_DB_URL: jdbc:postgresql://localhost:5432/backend_test
          BACKEND_TEST_DB_USERNAME: backend_test

