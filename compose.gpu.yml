# Optional CUDA profile for NVIDIA GPUs supported by Docker Desktop / WSL2.
# Run with: docker compose -p log-analyzer -f compose.yml -f compose.gpu.yml up -d --build
services:
  ai:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
        TORCH_PACKAGE: torch==2.7.1
    environment:
      LOG_AI_LLM_MODEL: ${GPU_LLM_MODEL:-Qwen/Qwen3-1.7B}
      LOG_AI_DEVICE: cuda
      LOG_AI_LLM_DTYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
